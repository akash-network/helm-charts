name: Test akash-provider charts

# Integration tests for the provider chart and the operators it is installed with:
# kind cluster + localnet chain (charts/akash-node), then the functional bats suite in test/akash-provider.
# The upgrade suite (make test-upgrade, released chart → this branch) is run locally only.
on:
  pull_request:
    paths:
      - charts/akash-provider/**
      - charts/akash-inventory-operator/**
      - charts/akash-hostname-operator/**
      - test/akash-provider/**
      - .github/workflows/test-akash-provider.yml
  workflow_dispatch:

concurrency:
  group: test-akash-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: kind + localnet (bats)
    # GitHub-hosted: the test bench needs a Docker daemon that can run kind.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBECONFIG: ${{ github.workspace }}/test/akash-provider/.cache/kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1

      - name: Tools
        run: |
          command -v bc || { sudo apt-get update && sudo apt-get install -y bc; }
          docker version --format '{{.Server.Version}}'
          kubectl version --client
          jq --version

      - name: Provider suite (fresh install, restarts, certificates, identity)
        run: make -C test/akash-provider test

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n akash-services describe pod akash-provider-0 || true
          kubectl -n akash-services logs akash-provider-0 -c init --tail=200 || true
          kubectl -n akash-services logs akash-provider-0 -c provider --tail=200 || true
          kubectl -n akash-localnet logs akash-node-1-0 -c akash-node --tail=50 || true

      - name: Upload bench logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: akash-provider-bench-logs
          path: test/akash-provider/.cache/*.log
          if-no-files-found: ignore
