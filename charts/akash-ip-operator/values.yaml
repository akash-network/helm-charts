# Default values for akash-ip-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/akash-network/provider

provider_address:

# Logging configuration, applied to the operator container as AP_LOG_* env vars.
# Refs https://github.com/akash-network/provider/blob/main/_docs/logging.md
logging:
  # trace|debug|info|warn|error|fatal|panic, or a per-module filter,
  # e.g. "operator-ip:debug,*:info"
  level: info
  # plain|json. json is recommended in Kubernetes (always uncolored).
  format: json
  # ANSI colors (plain format only)
  color: false
  # "off"|rfc3339|rfc3339nano|kitchen (quote "off", unquoted off is a YAML boolean)
  timestamp: rfc3339
  # Attach stack traces to error entries
  trace: false
