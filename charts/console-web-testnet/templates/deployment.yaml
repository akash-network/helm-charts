apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
  annotations:
    secrets.doppler.com/reload: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: ghcr.io/akash-network/deploy-web:{{ .Values.appVersion }}{{ if eq .Release.Namespace "staging" }}-beta{{ end }}
          imagePullPolicy: "Always"
          ports:
            - containerPort: 3000
              name: api-port
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: DEPLOYMENT_ENV
              value: {{ .Values.deploymentEnv }}
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: "2Gi"
              memory: "1Gi"
            requests:
              cpu: "0.5"
              ephemeral-storage: "1Gi"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24 # 120s boot budget before the liveness probe takes over
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: {{ .Chart.Name }}-secret
