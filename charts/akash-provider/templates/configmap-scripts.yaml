apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "provider.fullname" . }}-script
  namespace: {{ .Release.Namespace }}
data:
  lib.sh: |
{{ tpl (.Files.Get "scripts/lib.sh") . | indent 4 }}
  akt_context.sh: |
{{ tpl (.Files.Get "scripts/akt_context.sh") . | indent 4 }}
  identity.sh: |
{{ tpl (.Files.Get "scripts/identity.sh") . | indent 4 }}
  wait_for_rpc.sh: |
{{ tpl (.Files.Get "scripts/wait_for_rpc.sh") . | indent 4 }}
  provider_record.sh: |
{{ tpl (.Files.Get "scripts/provider_record.sh") . | indent 4 }}
  provider_cert.sh: |
{{ tpl (.Files.Get "scripts/provider_cert.sh") . | indent 4 }}
  init.sh: |
{{ tpl (.Files.Get "scripts/init.sh") . | indent 4 }}
  run.sh: |
{{ tpl (.Files.Get "scripts/run.sh") . | indent 4 }}
  liveness_checks.sh: |
{{ tpl (.Files.Get "scripts/liveness_checks.sh") . | indent 4 }}
{{- if .Values.bidpricescript }}
  price_script.sh: |
{{ .Values.bidpricescript | b64dec | indent 4 }}
{{- end }}
