{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-{{ .Values.chain }}-pgbouncer
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Chart.Name }}-{{ .Values.chain }}-pgbouncer
  ports:
    - protocol: TCP
      port: 5432
      targetPort: pgbouncer
      name: pgbouncer
  type: ClusterIP
{{- end }}
