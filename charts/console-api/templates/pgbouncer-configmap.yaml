{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-{{ .Values.chain }}-pgbouncer-config
  namespace: {{ .Release.Namespace }}
data:
  pgbouncer.ini: |
    [databases]
    * = host={{ .Values.pgbouncer.upstream.host }} port={{ .Values.pgbouncer.upstream.port }}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/auth/userlist.txt
    pool_mode = transaction
    max_prepared_statements = 200
    default_pool_size = {{ .Values.pgbouncer.defaultPoolSize }}
    max_client_conn = {{ .Values.pgbouncer.maxClientConn }}
    ignore_startup_parameters = extra_float_digits
    log_connections = 0
    log_disconnections = 0
{{- end }}
