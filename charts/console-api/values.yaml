appVersion: "2.79.3"
hostNames:

deploymentEnv: staging
chain: sandbox

otel:
  enabled: true

replicas: 2

resources:
  limits:
    cpu: 2
    ephemeral-storage: 2Gi
    memory: 4Gi
  requests:
    cpu: 250m
    ephemeral-storage: 1Gi
    memory: 1Gi

backgroundJobs:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      ephemeral-storage: 1Gi
      memory: 1Gi
    requests:
      cpu: 50m
      ephemeral-storage: 1Gi
      memory: 512Mi

stats:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      ephemeral-storage: 1Gi
      memory: 1Gi
    requests:
      cpu: 100m
      ephemeral-storage: 1Gi
      memory: 512Mi

nodeOptions:
  enabledOTEL: false

jobDefaults:
  failedJobsHistoryLimit: 10
  successfulJobsHistoryLimit: 0
  restartPolicy: Never
  resources:
    limits:
      cpu: 500m
      ephemeral-storage: 2Gi
      memory: 1Gi
    requests:
      cpu: 50m
      ephemeral-storage: 1Gi
      memory: 256Mi

# Transaction-mode pooler in front of the database. Needs a PGBOUNCER_USERLIST key in the release's Doppler secret, one `"user" "password"` line per database user.
pgbouncer:
  enabled: false
  replicas: 2
  image: edoburu/pgbouncer:v1.26.1-p0
  upstream:
    host: cloudsql-proxy-console-api
    port: 5432
  # Server connections per database and user, on each replica.
  defaultPoolSize: 20
  maxClientConn: 2000
  resources:
    limits:
      cpu: 1
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
